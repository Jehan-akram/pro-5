<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-dark text-white p-3">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <h1 class="fw-bold m-0" style="letter-spacing: 2px;"> GADGET <span class="text-warning">HUB</span></h1>
        <div class="d-flex gap-2 w-100 w-md-auto" style="max-width: 350px;">
            <input id="searchInput" type="text" placeholder="Enter gadget name" class="form-control rounded-3">
            <button id="addBtn" disabled class="btn btn-warning rounded-3 px-3 fw-bold">Add</button>
        </div>
    </div>
    </header>
    <h4 class="fw-bold text-center mt-3 pt-3" style="color: black;"><span id="gadgetsCount">0</span></h4>
    <div class="container py-4">
        <div class="row g-4 mt-3 pt-3" id="gadgetsContainer"></div>
    </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="script/java.js"></script> 
</body>
</html>
